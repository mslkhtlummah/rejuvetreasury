<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rejuve</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Poppins:wght@500;600;700;800&display=swap">
<style>
/* Layout: dark forest canvas, pale-lime data panels like the infographic, orange reserved for priority. */
:root{
  --f950:#06271c; --f900:#0b3526; --f800:#114632; --f700:#17583f;
  --olive:#2f4413; --lime:#e3ea2a; --leaf:#9cc61f; --pale:#dde66a; --pale2:#eef3a8;
  --ptext:#0f3321; --orange:#f39a2b; --orange-soft:#fbc98a; --red:#c8191f;
  --ink:#f4f7e0; --mute:#b9cba7; --line:rgba(227,234,42,.2); --card:rgba(255,255,255,.065);
  --display:'Poppins',system-ui,sans-serif; --body:'DM Sans',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background-color:var(--f950);background-image:linear-gradient(165deg,#06271c 0%,#0b3526 45%,#2c4212 100%);background-attachment:fixed;color:var(--ink);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--f950);z-index:30}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(2.1rem,6vw,3.7rem);font-weight:800}
h2{font-size:clamp(1.35rem,3vw,1.9rem);font-weight:700;color:var(--lime)}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
a{color:inherit}
.wrap{width:min(1120px,100%);margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
button{font:inherit;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:999px;padding:.8rem 1.4rem;font:600 .95rem var(--display);cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--lime);color:var(--f950)}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--lime)}
.btn.small{padding:.45rem .9rem;font-size:.82rem}
.btn.danger{background:transparent;border:2px solid rgba(200,25,31,.6);color:#ffb3b3}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,39,28,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:1rem;padding-block:.7rem}
.logo{display:flex;align-items:center;gap:.6rem;font:800 1.35rem var(--display);text-decoration:none;flex:none}
.logo svg{width:38px;height:38px}
.nav{display:flex;gap:.4rem;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding-block:2px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;padding:.5rem .95rem;border-radius:999px;font:600 .86rem var(--display);border:1.5px solid var(--line);color:var(--ink);white-space:nowrap}
.nav a svg{width:16px;height:16px}
.nav a[aria-current="page"]{background:var(--lime);color:var(--f950);border-color:var(--lime)}
.user{display:flex;align-items:center;gap:.5rem;flex:none}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--orange);color:var(--f950);display:grid;place-items:center;font:700 .95rem var(--display)}
.user .nm{font-size:.88rem;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:900px){.hdr-in{flex-wrap:wrap}.nav{order:3;flex-basis:100%}.user .nm{display:none}.user{margin-left:auto}}

/* generic blocks */
main{padding-block:1.5rem 3rem}
section.blk{margin-top:2.6rem}
.blk>h2{margin-bottom:.4rem}
.sub{color:var(--mute);max-width:62ch;margin-bottom:1.2rem}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.2rem;min-width:0}
.pcard{background:var(--pale);color:var(--ptext);border-radius:18px;padding:1.2rem;min-width:0}
.pcard h3{display:inline-block;background:var(--f800);color:var(--lime);padding:.3rem .9rem;border-radius:999px;margin:-.2rem 0 .9rem;font-size:.95rem}
.src{font-size:.76rem;opacity:.75;margin-top:.8rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.25rem .7rem;border-radius:999px;font:600 .78rem var(--display);background:rgba(227,234,42,.15);color:var(--lime)}
.chip.or{background:rgba(243,154,43,.18);color:var(--orange)}
.chip.rd{background:rgba(200,25,31,.25);color:#ffb3b3}
.tag{font:600 .72rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}

/* hero */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:1rem;align-items:end;border-radius:26px;background:linear-gradient(135deg,rgba(23,88,63,.75),rgba(47,68,19,.8));border:1px solid var(--line);padding:clamp(1.2rem,4vw,2.4rem);overflow:hidden}
.hero-copy{position:relative;z-index:2;display:grid;gap:1rem;align-content:start}
.hero .lead{font-size:1.1rem;max-width:46ch;color:#e6efcf}
.cta{display:flex;flex-wrap:wrap;gap:.6rem}
.hero-art{position:relative;min-height:300px}
.hero-art .farmer{position:absolute;right:0;bottom:-6px;width:min(300px,78%);z-index:2}
.hero-art .p1{position:absolute;left:-10px;bottom:0;width:190px;opacity:.9}
.hero-art .p2{position:absolute;right:-50px;bottom:0;width:230px;opacity:.55}
@media(max-width:760px){.hero{grid-template-columns:minmax(0,1fr)}.hero-art{min-height:230px;order:-1}.hero-art .farmer{width:200px}.hero-art .p1{width:150px}}
.status{display:grid;grid-template-columns:1fr 1fr;gap:1rem;background:rgba(6,39,28,.55);border:1px solid var(--line);border-radius:16px;padding:1rem}
@media(max-width:520px){.status{grid-template-columns:1fr}}
.status small{color:var(--mute);display:block}
.big{font:800 clamp(1.7rem,4vw,2.3rem)/1.1 var(--display);color:var(--lime)}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;margin:.45rem 0}
.bar>i{display:block;height:100%;background:var(--lime);border-radius:99px;transition:width .4s}

/* stats */
.stat{background:var(--pale);color:var(--ptext);border-radius:16px;padding:1rem 1.1rem}
.stat b{display:block;font:800 clamp(1.5rem,3.4vw,2rem)/1.1 var(--display)}
.stat span{font-size:.88rem;display:block;margin-top:.3rem}
.stat.hot{background:var(--orange)}
.stat em{font-style:normal;font-size:.72rem;opacity:.7;display:block;margin-top:.4rem}

/* bars lists */
.rows{display:grid;gap:.45rem}
.row{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:.6rem;font-size:.9rem}
.row .tr{height:26px;border-radius:99px;background:rgba(15,51,33,.14);position:relative;overflow:hidden}
.row .tr i{position:absolute;inset:0 auto 0 0;background:var(--f800);border-radius:99px}
.row .tr b{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:700 .8rem var(--display);color:#fff;mix-blend-mode:normal}
.row.me .tr i{background:var(--red)}
.row.me{font-weight:700}
.minihead{font:600 .8rem var(--display);margin:.2rem 0 .5rem}

.donutwrap{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;flex:none}
.legend{display:grid;gap:.4rem;font-size:.88rem}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:.45rem;vertical-align:-1px}
.funnel{display:grid;gap:.5rem}
.funnel .f{border-radius:8px;padding:.45rem .7rem;color:#fff;font:600 .82rem var(--display);display:flex;justify-content:space-between;gap:.6rem;min-width:0}
.down{display:flex;align-items:center;gap:.8rem}
.down svg{width:54px;height:60px;flex:none}

/* feature cards */
.feat{display:grid;gap:.5rem;text-decoration:none;transition:transform .15s,border-color .15s}
.feat:hover{transform:translateY(-3px);border-color:var(--lime)}
.feat .ic{width:44px;height:44px;border-radius:12px;background:var(--lime);color:var(--f950);display:grid;place-items:center}
.feat .ic svg{width:24px;height:24px}
.feat p{color:var(--mute);font-size:.92rem}
.steps3{counter-reset:s;display:grid;gap:.8rem}
.steps3 li{list-style:none;display:grid;grid-template-columns:auto 1fr;gap:.8rem}
.steps3 li::before{counter-increment:s;content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--orange);color:var(--f950);display:grid;place-items:center;font:700 .95rem var(--display)}
.steps3{padding:0;margin:0}

/* forms */
.form{display:grid;gap:.9rem}
.fld{display:grid;gap:.3rem}
.fld>span{font:600 .84rem var(--display);color:var(--lime)}
.fld small{color:var(--mute);font-size:.78rem}
input[type=number],input[type=text],select{width:100%;background:rgba(0,0,0,.28);border:1.5px solid var(--line);border-radius:12px;padding:.65rem .8rem;color:var(--ink);font:500 1rem var(--body)}
select option{background:var(--f900);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--lime)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.2rem;align-items:start}
@media(max-width:860px){.split{grid-template-columns:minmax(0,1fr)}}
.sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 120px)}
@media(max-width:860px){.sticky{position:static}}
.ring{width:150px;height:150px;flex:none}
.ring text{font:800 34px var(--display);fill:var(--ink)}
.resbox{display:flex;gap:1.1rem;align-items:center;flex-wrap:wrap}
.todo{display:grid;gap:.45rem;padding:0;margin:.6rem 0 0;list-style:none}
.todo li{display:flex;gap:.6rem;font-size:.92rem}
.todo li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange);margin-top:.5rem;flex:none}
.note{font-size:.8rem;color:var(--mute);margin-top:.8rem}
.break{display:grid;gap:.6rem;margin-top:1rem}
.break .l{display:flex;justify-content:space-between;font-size:.85rem}

/* checklist */
.chk{display:grid;gap:.5rem;margin:0;padding:0;list-style:none}
.chk label{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;padding:.7rem .8rem;border-radius:12px;background:rgba(0,0,0,.2);border:1px solid transparent;cursor:pointer}
.chk label:hover{border-color:var(--line)}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--lime)}
.chk b{display:block;font-weight:700}
.chk small{color:var(--mute)}
.chk label.done b{text-decoration:line-through;opacity:.65}
.phase{margin-top:1.2rem}
.phase h3{display:flex;gap:.6rem;align-items:center;margin-bottom:.6rem}
.phases{display:flex;gap:.4rem;flex-wrap:wrap}

/* map + table */
.mapbox{background:linear-gradient(160deg,#0e4330,#133a22);border:1px solid var(--line);border-radius:18px;padding:.6rem;min-width:0}
.mapbox svg{display:block;width:100%;height:auto}
.land{fill:#1d5a3f;stroke:#2c7a55;stroke-width:1.2}
.land.pri{fill:var(--orange);stroke:#ffd29a}
.pin{cursor:pointer}
.pin circle{fill:var(--red);stroke:#fff;stroke-width:2}
.pin text{font:700 13px var(--display);fill:#fff;paint-order:stroke;stroke:#06271c;stroke-width:3px}
.pin:focus-visible circle,.pin.on circle{fill:var(--lime);stroke:var(--f950)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.tab{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:.45rem .9rem;font:600 .84rem var(--display);cursor:pointer}
.tab[aria-selected="true"]{background:var(--lime);color:var(--f950);border-color:var(--lime)}
.tab.o[aria-selected="true"]{background:var(--orange);border-color:var(--orange)}
.tscroll{overflow-x:auto;border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.9rem}
th,td{padding:.6rem .7rem;text-align:left;border-bottom:1px solid rgba(15,51,33,.15)}
.pt th,.pt td{color:var(--ptext)}
.pt thead th{font:700 .8rem var(--display)}
.pt .c1{background:var(--orange-soft)}.pt thead .c1{background:var(--orange)}
.pt .c2{background:#f6e7a8}.pt thead .c2{background:#f3d77a}
.pt .c3{background:#fff}.pt thead .c3{background:#f3f3e6}
.pt tr.tot td{background:var(--red);color:#fff;font-weight:700}
.pt td:first-child,.pt th:first-child{background:var(--pale2);font-weight:600}
.mini{display:grid;gap:.5rem}
.mini .r{display:grid;grid-template-columns:110px 1fr auto;gap:.5rem;align-items:center;font-size:.82rem}
.mini .tr{height:14px;border-radius:99px;background:rgba(15,51,33,.14);overflow:hidden}
.mini .tr i{display:block;height:100%;border-radius:99px}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart .ax{fill:var(--mute);font:500 11px var(--body)}
.chart .gl{stroke:rgba(255,255,255,.1);stroke-width:1}
.chart .l1{stroke:var(--mute);stroke-width:2;stroke-dasharray:5 4;fill:none}
.chart .l2{stroke:var(--lime);stroke-width:3;fill:none}
.chart .wait{fill:rgba(243,154,43,.16)}
.chart .lbl{fill:var(--orange);font:600 11px var(--display)}
.chart .x{fill:var(--lime)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin-top:1rem}
.kpi{background:rgba(0,0,0,.22);border-radius:12px;padding:.7rem .8rem}
.kpi small{color:var(--mute);display:block;font-size:.78rem}
.kpi b{font:700 1.15rem var(--display)}
.kpi.warn b{color:var(--orange)}

/* koperasi */
.members td,.members th{border-bottom:1px solid var(--line);color:var(--ink)}
.members input,.members select{padding:.4rem .5rem;font-size:.9rem;border-radius:8px;min-width:70px}
.members input[type=text]{min-width:140px}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;margin-bottom:1rem}
@media(max-width:700px){.sum{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* login */
.login{position:relative;min-height:100%;overflow:hidden;display:flex;align-items:center;background:radial-gradient(1000px 600px at 78% 8%,rgba(227,234,42,.28),transparent 60%),linear-gradient(165deg,#06271c,#0b3526 50%,#2c4212)}
.login .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:1.5rem;align-items:center;padding-block:2rem}
.lcard{background:rgba(6,39,28,.82);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:24px;padding:clamp(1.4rem,4vw,2.2rem);display:grid;gap:1.1rem;position:relative;z-index:3}
.lcard .logo{font-size:1.9rem}
.lcard .logo svg{width:50px;height:50px}
.lcard p.lead{color:#dbe7c4}
.gbtn{display:flex;align-items:center;justify-content:center;gap:.7rem;width:100%;background:#fff;color:#1f2a24;border:0;border-radius:999px;padding:.85rem 1.2rem;font:600 1rem var(--display);cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.gbtn svg{width:22px;height:22px}
.gbtn:hover{transform:translateY(-1px)}
.sdg{display:flex;gap:.5rem;flex-wrap:wrap}
.sdg span{display:flex;align-items:center;gap:.5rem;border-radius:8px;color:#fff;padding:.3rem .6rem;font:600 .7rem/1.15 var(--display)}
.sdg b{font:800 1.4rem var(--display)}
.scene{position:relative;height:min(640px,78vh);min-height:420px}
.scene .farmer{position:absolute;right:2%;bottom:0;width:min(400px,62%);z-index:2}
.scene .pa{position:absolute;bottom:-10px;z-index:1}
.scene .hill{position:absolute;left:-10%;right:-10%;bottom:-70px;height:170px;z-index:2;pointer-events:none}
.dialog{display:grid;gap:.8rem;margin-top:.3rem;padding-top:1rem;border-top:1px solid var(--line)}
@media(max-width:860px){.login{align-items:flex-start}.login .wrap{grid-template-columns:minmax(0,1fr);gap:0;padding-block:0 1.5rem}.scene{order:-1;height:290px;min-height:0;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)))}.scene .farmer{width:210px}.lcard{margin-top:-30px}}
footer{border-top:1px solid var(--line);padding-block:1.4rem 2.5rem;color:var(--mute);font-size:.8rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const nf=new Intl.NumberFormat('id-ID',{maximumFractionDigits:2});
const fmt=n=>nf.format(n);
const rp=n=>'Rp'+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Math.round(n));
const rpc=n=>{const a=Math.abs(n);const s=n<0?'-':'';if(a>=1e9)return s+'Rp'+fmt(a/1e9)+' miliar';if(a>=1e6)return s+'Rp'+fmt(a/1e6)+' juta';return s+rp(a)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));

/* ---------- state ---------- */
const KEY='rejuve.v1';
const defaults=()=>({user:null,dana:60,
  k:{touched:false,prov:'Riau',luas:2,umur:27,prod:9,legal:'desa',hutan:'ragu',lemb:'belum'},
  steps:{},bakar:{},
  sim:{luas:2,prodNow:9,prodAfter:22,harga:3200,biaya:65,tbm:36,hidup:3,tumpang:0},
  members:[{n:'Pak Slamet (contoh)',ha:2,umur:28,legal:'ya'},{n:'Bu Marni (contoh)',ha:1.5,umur:24,legal:'tidak'},{n:'Pak Jonas (contoh)',ha:3.5,umur:16,legal:'ya'}]});
let S=(()=>{const d=defaults();try{const r=JSON.parse(localStorage.getItem(KEY)||'{}');return Object.assign(d,r,{k:Object.assign(d.k,r.k),sim:Object.assign(d.sim,r.sim)})}catch(e){return d}})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- illustration ---------- */
function palm(w,opts={}){
  const cx=100,cy=80,L0=opts.len||84; let s='';
  const dark=opts.dark;
  s+=`<path d="M91 300 C93 230 97 150 ${cx-4} ${cy+6} L${cx+6} ${cy+6} C108 150 111 230 113 300 Z" fill="${dark?'#3d3416':'#6a5826'}"/>`;
  for(let y=cy+24;y<292;y+=12){const k=6+(y-cy)*.03;s+=`<path d="M${cx-k} ${y} q${k} 4 ${2*k} 0" stroke="#2c250e" stroke-width="2" fill="none" opacity=".5"/>`}
  const angs=[-178,-156,-134,-112,-90,-68,-46,-24,-2];
  angs.forEach((deg,i)=>{
    const a=deg*Math.PI/180,L=L0*(0.82+0.18*Math.abs(Math.cos(a)));
    const dx=Math.cos(a),dy=Math.sin(a);
    const P0=[cx,cy],C=[cx+dx*L*.55,cy+dy*L*.55-24],P1=[cx+dx*L,cy+dy*L+22];
    const col=(i%2?(dark?'#2a6b30':'#3f9a3a'):(dark?'#215a2a':'#2f8a3a'));
    s+=`<path d="M${P0} Q${C} ${P1}" stroke="#2c6a2a" stroke-width="2.6" fill="none"/>`;
    for(let j=1;j<=11;j++){
      const t=j/12,u=1-t;
      const px=u*u*P0[0]+2*u*t*C[0]+t*t*P1[0],py=u*u*P0[1]+2*u*t*C[1]+t*t*P1[1];
      let tx=2*u*(C[0]-P0[0])+2*t*(P1[0]-C[0]),ty=2*u*(C[1]-P0[1])+2*t*(P1[1]-C[1]);
      const tl=Math.hypot(tx,ty);tx/=tl;ty/=tl;
      const len=15*(Math.sin(Math.PI*t)*.7+.3);
      [-1,1].forEach(sd=>{
        let vx=tx*.55+(-ty)*sd*.9,vy=ty*.55+tx*sd*.9;const vl=Math.hypot(vx,vy);

/* ---------- derived logic ---------- */
function eligibility(k){
  const luas=+k.luas||0,umur=+k.umur||0,prod=+k.prod||0;
  const ageS=umur>=25?25:umur>=20?16:umur>=15?8:2;
  const prodS=prod<10?15:prod<14?9:prod<18?4:0;
  const legal={lengkap:20,desa:10,belum:0}[k.legal];
  const hutan={tidak:15,ragu:7,ya:0}[k.hutan];
  const lemb={ya:15,belum:3}[k.lemb];
  const size=luas>0&&luas<=4?10:luas>4?6:0;
  const need=ageS+prodS, ready=legal+hutan+lemb+size;
  const total=need+ready;
  const todo=[];
  if(k.legal==='desa')todo.push('Tingkatkan surat desa menjadi sertifikat atau bukti kepemilikan yang diakui, dan urus STDB.');
  if(k.legal==='belum')todo.push('Urus legalitas lahan lebih dulu: STDB dan bukti kepemilikan.');
  if(k.hutan==='ragu')todo.push('Cek ke dinas perkebunan apakah lahan masuk kawasan hutan.');
  if(k.hutan==='ya')todo.push('Lahan dalam kawasan hutan tidak bisa diajukan sampai statusnya jelas.');
  if(k.lemb==='belum')todo.push('Bergabung ke kelompok tani atau koperasi, karena pengajuan lewat kelembagaan.');
  if(luas>4)todo.push('Dana dihitung untuk maksimal 4 ha per pekebun. Sisanya bisa bertahap.');
  if(need<22)todo.push('Kebun belum terlalu mendesak diremajakan. Tingkatkan perawatan dulu dan pantau produktivitas.');
  const status=total>=75?['Siap diajukan','']:total>=50?['Perlu dilengkapi','or']:['Belum siap','rd'];
  const hibah=Math.min(luas,4)*S.dana*1e6;
  return {total,need,ready,todo,status,hibah};
}
function stageInfo(){
  const done=STEPS.filter((s,i)=>S.steps[i]).length;
  const next=STEPS.findIndex((s,i)=>!S.steps[i]);
  return {done,pct:Math.round(done/STEPS.length*100),phase:next<0?'Selesai':PHASES[STEPS[next].p]};
}
function simCalc(p){
  const L=+p.luas,margin=.6;
  const nowM=L*p.prodNow*1000*p.harga*margin/12, afterM=L*p.prodAfter*1000*p.harga*margin/12;
  const cost=L*p.biaya*1e6, grant=Math.min(L,4)*S.dana*1e6, oop=Math.max(0,cost-grant);
  const lost=Math.max(0,(nowM-p.tumpang*1e6))*p.tbm;
  const gap=oop+lost;
  const A=[0],B=[-oop];let cross=null;
  for(let m=1;m<=96;m++){
    A.push(A[m-1]+nowM);
    B.push(B[m-1]+(m<=p.tbm?p.tumpang*1e6:afterM));
    if(cross===null&&B[m]>=A[m])cross=m;
  }
  return {nowM,afterM,cost,grant,oop,lost,gap,A,B,cross};
}

function chartSVG(r,tbm){
  const W=640,H=300,l=62,rr=14,t=16,b=34;
  const all=r.A.concat(r.B),mn=Math.min(0,...all),mx=Math.max(...all);
  const raw=(mx-mn)/4||1,mag=Math.pow(10,Math.floor(Math.log10(raw))),step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw);
  const y0=Math.floor(mn/step)*step,y1=Math.ceil(mx/step)*step;
  const X=m=>l+m/96*(W-l-rr),Y=v=>t+(1-(v-y0)/(y1-y0))*(H-t-b);
  let g='';
  for(let v=y0;v<=y1+1;v+=step)g+=`<line class="gl" x1="${l}" x2="${W-rr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${l-8}" y="${Y(v)+4}" text-anchor="end">${fmt(Math.round(v/1e6))} jt</text>`;
  for(let y=0;y<=8;y++)g+=`<text class="ax" x="${X(y*12)}" y="${H-12}" text-anchor="middle">Th ${y}</text>`;
  const path=a=>a.map((v,m)=>(m?'L':'M')+X(m).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Arus kas kumulatif kebun, dengan dan tanpa peremajaan">
   <rect class="wait" x="${X(0)}" y="${t}" width="${X(tbm)-X(0)}" height="${H-t-b}"/>
   <text class="lbl" x="${X(0)+6}" y="${t+13}">Masa tunggu panen</text>${g}
   <path class="l1" d="${path(r.A)}"/><path class="l2" d="${path(r.B)}"/>
   ${r.cross?`<circle class="x" cx="${X(r.cross)}" cy="${Y(r.B[r.cross])}" r="6"/><text class="lbl" style="fill:var(--lime)" x="${Math.min(X(r.cross),W-90)}" y="${Y(r.B[r.cross])-12}">Impas bulan ${r.cross}</text>`:''}</svg>`;
}

function koperasiView(){
  return `<h1 style="font-size:clamp(1.8rem,4.5vw,2.6rem)">Mode Koperasi</h1>
  <p class="sub" style="margin-top:.6rem">Catat anggota dan kebunnya. Rejuve menunjukkan siapa yang siap diajukan, siapa yang perlu melengkapi legalitas, dan total perkiraan dana kelompok. Tiga baris pertama hanyalah contoh, ganti dengan data anggotamu.</p>
  <div class="sum" id="msum"></div>
  <div class="card"><div class="tscroll"><table class="members"><thead><tr><th>Nama</th><th>Luas (ha)</th><th>Umur tanaman</th><th>Legalitas lengkap</th><th>Status</th><th></th></tr></thead><tbody id="mrows"></tbody></table></div>
  <div style="display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem"><button class="btn primary small" id="madd" type="button">Tambah anggota</button><button class="btn ghost small" id="mcopy" type="button">Salin ringkasan</button><span id="mmsg" class="note" style="align-self:center;margin:0" role="status"></span></div></div>`;
}
function koperasiInit(){
  const rows=()=>{$('#mrows').innerHTML=S.members.map((m,i)=>`<tr data-i="${i}"><td><input type="text" data-f="n" value="${esc(m.n)}" aria-label="Nama anggota"></td><td><input type="number" data-f="ha" min="0" step="0.1" value="${m.ha}" aria-label="Luas"></td><td><input type="number" data-f="umur" min="0" max="45" value="${m.umur}" aria-label="Umur tanaman"></td><td><select data-f="legal" aria-label="Legalitas"><option value="ya" ${m.legal==='ya'?'selected':''}>Ya</option><option value="tidak" ${m.legal!=='ya'?'selected':''}>Belum</option></select></td><td><span class="chip ${memberStatus(m)[1]}" data-st>${memberStatus(m)[0]}</span></td><td><button class="btn danger small" data-del type="button" aria-label="Hapus ${esc(m.n)}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="6" style="color:var(--mute)">Belum ada anggota. Tekan Tambah anggota.</td></tr>';sum()};
  const sum=()=>{const ha=S.members.reduce((a,m)=>a+(+m.ha||0),0),ready=S.members.filter(m=>memberStatus(m)[0]==='Siap diajukan').length,dana=S.members.reduce((a,m)=>a+Math.min(+m.ha||0,4)*S.dana*1e6,0);
    $('#msum').innerHTML=[['Anggota',S.members.length],['Total luas',fmt(ha)+' ha'],['Siap diajukan',ready],['Perkiraan dana',rpc(dana)]].map(([a,b])=>`<div class="kpi"><small>${a}</small><b>${b}</b></div>`).join('')};
  $('#mrows').addEventListener('input',e=>{const tr=e.target.closest('tr'),f=e.target.dataset.f;if(!tr||!f)return;const m=S.members[tr.dataset.i];m[f]=['ha','umur'].includes(f)?parseFloat(e.target.value)||0:e.target.value;const st=memberStatus(m),c=$('[data-st]',tr);c.textContent=st[0];c.className='chip '+st[1];save();sum()});
  $('#mrows').addEventListener('click',e=>{if(e.target.closest('[data-del]')){S.members.splice(+e.target.closest('tr').dataset.i,1);save();rows()}});
  $('#madd').onclick=()=>{S.members.push({n:'',ha:1,umur:20,legal:'tidak'});save();rows()};
  $('#mcopy').onclick=async()=>{const t='Ringkasan anggota (Rejuve)\n'+S.members.map(m=>`- ${m.n||'Tanpa nama'}: ${m.ha} ha, umur ${m.umur} th, ${memberStatus(m)[0]}`).join('\n');
    try{await navigator.clipboard.writeText(t);$('#mmsg').textContent='Ringkasan disalin.'}catch(e){$('#mmsg').textContent='Salin manual: tekan lama pada daftar di atas.'}};
  rows();
}

/* ---------- router ---------- */
const VIEWS={beranda:[berandaView,null],kelayakan:[kelayakanView,kelayakanInit],pelacak:[pelacakView,pelacakInit],dana:[danaView,danaInit],peta:[petaView,petaInit],'tanpa-bakar':[bakarView,bakarInit],koperasi:[koperasiView,koperasiInit]};
let lastId=null;
function render(){
  const app=$('#app');
  if(!S.user){app.innerHTML=loginView();bindLogin();lastId=null;return}
  let id=location.hash.slice(1);if(!VIEWS[id])id='beranda';
  const [v,init]=VIEWS[id];
  app.innerHTML=shell(id,v());
  $('#logout').onclick=()=>{S.user=null;save();location.hash='masuk';render()};
  if(init)init();
  if(id!==lastId)window.scrollTo(0,0);
  lastId=id;
}
window.addEventListener('hashchange',render);
render();
</script>
</body>
</html>
